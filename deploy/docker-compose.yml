# ============================================================
# Uni-Sign Docker Compose 部署
#
# 使用:
#   docker-compose -f deploy/docker-compose.yml up -d
#   docker-compose -f deploy/docker-compose.yml logs -f
#   docker-compose -f deploy/docker-compose.yml down
# ============================================================

version: "3.8"

services:
  # ---- Web API 服务 ----
  uni-sign-api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: uni-sign-api:latest
    container_name: uni-sign-api
    restart: unless-stopped

    # GPU 访问
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

    # 端口映射
    ports:
      - "8080:8080"

    # 挂载外部存储（模型权重 + 数据）
    volumes:
      - ${STORAGE_PATH:-./Uni-Sign-storage}:/app/Uni-Sign-storage:ro

    # 启动参数
    command: ["--mode", "${MODE:-balanced}", "--host", "0.0.0.0", "--port", "8080"]

    # 环境变量
    environment:
      - UNISIGN_STORAGE_ROOT=/app/Uni-Sign-storage
      - NVIDIA_VISIBLE_DEVICES=all
      - PYTHONUNBUFFERED=1

    # 健康检查
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

    # 日志限制
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"

  # ---- （可选）Nginx 反向代理 ----
  nginx:
    image: nginx:alpine
    container_name: uni-sign-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - uni-sign-api
    profiles:
      - production  # 仅在生产 profile 下启动: docker-compose --profile production up
