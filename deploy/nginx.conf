# Uni-Sign API 反向代理配置
# 用于生产环境：Docker Compose 带 --profile production

upstream uni_sign_backend {
    server uni-sign-api:8080;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    # 最大上传大小（姿态文件通常 < 5MB）
    client_max_body_size 50m;

    # 超时设置（推理可能需要几秒）
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;

    # 访问日志
    access_log /var/log/nginx/uni-sign-access.log;
    error_log /var/log/nginx/uni-sign-error.log;

    # Gzip 压缩
    gzip on;
    gzip_types application/json;
    gzip_min_length 100;

    # 限流（每秒最多 5 个请求，burst 10）
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=5r/s;
    limit_req zone=api_limit burst=10 nodelay;

    # API 路由
    location / {
        proxy_pass http://uni_sign_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # 健康检查端点不过多限制
        location /health {
            limit_req zone=api_limit burst=20;
            proxy_pass http://uni_sign_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Connection "";
        }
    }
}
